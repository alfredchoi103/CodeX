discoveryClaims:
  - id: claim.projection-demo
    label: Projection demonstration claim
    statement: "Projection-only demonstration: accepted object types are supported by the reviewed domain model."
    status: proposed
    reasoningRules:
      - rule.projectionEvidence
    evidenceRefs: [evidence.domain-model]
    counterEvidenceRefs: []
    counterEvidenceLevel: none
    counterEvidenceAssessment: "No material conflict: the reviewed domain-model search found no contradiction within projection scope; runtime behavior remains outside scope. Rubric score: 100."
    alternatives:
      - The projection may reflect a documentation model rather than deployed runtime behavior.
    confidenceDimensions:
      crossSourceAgreement: 95
      evidenceCoverage: 95
      runtimeSupport: 70
      semanticSpecificity: 95
      constraintConsistency: 95
      counterEvidenceAssessment: 100
    confidenceRationale:
      crossSourceAgreement: {score: 95, rationale: Reviewed model sections consistently define the projected object types., evidenceRefs: [evidence.domain-model], deductions: [Only one governed artifact was available.]}
      evidenceCoverage: {score: 95, rationale: Every projected object type is covered by the reviewed model., evidenceRefs: [evidence.domain-model], deductions: [Runtime bindings are outside this bounded claim.]}
      runtimeSupport: {score: 70, rationale: The claim concerns a projection and has no direct runtime observation., evidenceRefs: [], deductions: [No execution evidence was used for runtime conformance.]}
      semanticSpecificity: {score: 95, rationale: The claim is explicitly limited to accepted projected object types., evidenceRefs: [evidence.domain-model], deductions: [It does not assert runtime behavior.]}
      constraintConsistency: {score: 95, rationale: Reviewed object definitions do not conflict within projection scope., evidenceRefs: [evidence.domain-model], deductions: [Cross-artifact constraint consistency was not assessed.]}
      counterEvidenceAssessment: {score: 100, rationale: A recorded review found no material conflict in the bounded source., evidenceRefs: [evidence.domain-model], deductions: []}
    confidence: 91
    grade: A
    falsifiers:
      - A reviewed domain-model source contradicts one or more projected object types.
    validationQuestions:
      - Do all projected object types retain stable identity in the reviewed source?
    capabilityQuestions:
      - Can the projection trace each accepted object type to its reviewed evidence?
    provenance:
      extractorVersion: manual-review-1
      ruleSetVersion: projection-rules-1.0.0
      generatedAt: "2026-07-27T10:00:00Z"
